name: Gui van ban moi nhat len Telegram

on:
  workflow_dispatch:
    inputs:
      so_luong:
        description: 'So van ban muon gui (mac dinh: 5)'
        required: false
        default: '5'

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Gui van ban moi nhat
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scheduler.py --send-latest ${{ github.event.inputs.so_luong }}
